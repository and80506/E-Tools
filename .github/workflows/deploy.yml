name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Demo
        # 设置 VITE_DEMO_MODE=true 以开启前端 mock 拦截
        # 写入 .env 确保被 Vite 1.x 正确读取
        # 设置 --base=/Value-Invest-Sys/ 适配 GitHub Pages 的默认路径格式
        run: |
          echo "VITE_DEMO_MODE=true" > .env
          npm run build -- --base=/Value-Invest-Sys/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
